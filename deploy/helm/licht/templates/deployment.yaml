apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "licht.fullname" . }}
  labels:
    {{- include "licht.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "licht.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "licht.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "licht.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless "nonroot" uid; needed so kubelet can verify non-root
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: licht
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
